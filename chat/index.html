<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lattice chat</title>
  <meta name="description" content="Chat with Lattice Quark and Lattice Spark — two 1.5B models, one trained entirely from scratch, running on Lattice's own GPU." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/pulse-chat.css" />
</head>
<body class="pulse-app">
  <aside class="pulse-sidebar" id="sidebar" aria-label="Chat history">
    <div class="pulse-sidebar-head">
      <a href="/" class="pulse-brand" aria-label="Lattice home">
        <span class="pulse-brand-mark" aria-hidden="true"></span>
        Lattice
      </a>
      <button type="button" class="pulse-sidebar-close" id="sidebar-close" aria-label="Close sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <button type="button" class="pulse-new-chat-btn" id="new-chat-sidebar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <nav class="pulse-session-list" id="session-list" aria-label="Previous chats"></nav>
    <div class="pulse-sidebar-foot">
      <p class="pulse-sidebar-note">Sessions live in this browser only, nothing is stored on the server.</p>
      <button type="button" class="pulse-clear-all" id="clear-all-chats">Clear history</button>
    </div>
  </aside>
  <div class="pulse-sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <div class="pulse-main">
    <button type="button" class="pulse-topbar-btn pulse-sidebar-toggle" id="sidebar-open" aria-label="Open chat history">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="pulse-scroll" id="pulse-scroll">
      <div class="pulse-messages" id="messages" aria-live="polite">
        <div class="pulse-welcome" id="welcome">
          <h1 class="pulse-welcome-title" id="welcome-title"></h1>
          <div class="pulse-suggestions" id="suggestions" aria-label="Suggested questions"></div>
        </div>
      </div>
    </div>

    <footer class="pulse-composer-wrap">
      <div class="pulse-status" id="chat-status" data-kind="warm" hidden></div>
      <form class="pulse-composer" id="chat-form">
        <div class="pulse-input-box">
          <div class="pulse-input-row">
            <span class="pulse-input-glyph" aria-hidden="true">&gt;</span>
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Ask Quark or Spark anything…"
              autocomplete="off"
              maxlength="4000"
            ></textarea>
          </div>
          <div class="pulse-composer-actions">
            <div class="pulse-model-wrap">
              <button type="button" class="pulse-model-btn" id="model-btn" aria-haspopup="listbox" aria-expanded="false">
                <span class="pulse-model-dot" id="model-dot" data-model="spark"></span>
                <span id="model-btn-label">Spark · 1.5B</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="pulse-model-menu" id="model-menu" role="listbox" hidden>
                <button type="button" class="pulse-model-option" data-model="quark" role="option">
                  <span class="pulse-model-option-dot" data-model="quark"></span>
                  <span class="pulse-model-option-names">
                    <span class="pulse-model-option-name">Lattice Quark</span>
                    <span class="pulse-model-option-meta">1.5B · From scratch · Rambler</span>
                  </span>
                </button>
                <button type="button" class="pulse-model-option is-active" data-model="spark" role="option">
                  <span class="pulse-model-option-dot" data-model="spark"></span>
                  <span class="pulse-model-option-names">
                    <span class="pulse-model-option-name">Lattice Spark</span>
                    <span class="pulse-model-option-meta">1.5B · From scratch · Clarifier</span>
                  </span>
                </button>
              </div>
            </div>
            <div class="pulse-composer-right">
              <button type="button" class="pulse-icon-btn" id="stop-btn" hidden aria-label="Stop generating">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              </button>
              <button type="button" class="pulse-icon-btn" id="regen-btn" hidden aria-label="Regenerate reply">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
              </button>
              <button type="submit" class="pulse-send" id="send-btn" aria-label="Send message" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
      </form>
      <p class="pulse-footnote">Lattice models can make mistakes. Research preview</p>
    </footer>
  </div>

  <script src="/js/pulse-chat.js"></script>
</body>
</html>
