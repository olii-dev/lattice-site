<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice Pulse — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chat-page">
  <header class="header">
    <a href="/" class="logo">Lattice</a>
    <nav class="nav">
      <a href="index.html#models">Models</a>
      <a href="mini.html">Mini</a>
    </nav>
  </header>

  <main>
    <div class="chat-header">
      <a href="index.html">← Back</a>
      <h1>Lattice Pulse</h1>
      <p>1.5B conversational fine-tune · powered by Modal GPU</p>
    </div>

    <div class="chat-panel" id="chat-panel">
      <div class="chat-status" id="chat-status" data-kind="warm">Connecting…</div>
      <div class="messages" id="messages" aria-live="polite">
        <div class="msg msg-assistant">
          <span class="msg-label">Pulse</span>
          <p>Hi! I'm Lattice Pulse. Ask me anything — first load may take a minute while the GPU starts.</p>
        </div>
      </div>
      <form class="chat-form" id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Ask Lattice Pulse…"
          autocomplete="off"
          maxlength="500"
        />
        <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
      </form>
    </div>

    <p class="chat-disclaimer">
      Research preview — responses may be inaccurate. Try: “Who made you?” then a follow-up.
    </p>
  </main>

  <script src="js/pulse-chat.js"></script>
</body>
</html>
